# MCP-Tripwire — packaging & tooling.
# Managed by `uv`. Deterministic core is stdlib-only; ADK is an optional extra.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-tripwire"
version = "0.1.0"
description = "A lightweight OSS trust gateway for MCP tools: continuous schema-integrity enforcement + portable signed attestations."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Aboubakar Koïta" }]
keywords = ["mcp", "security", "agents", "attestation", "tool-poisoning", "supply-chain"]
# Deterministic core has ZERO runtime dependencies (Hard Rule #2).
dependencies = []

[project.optional-dependencies]
# Optional ADK multi-agent layer (P1). Kept out of the core so the spine stays dependency-free.
agent = [
  "fastapi>=0.111.0",
  "google-adk>=0.5.0",
  "httpx-sse>=0.4.0",
  "mcp>=1.2.0",
  "sse-starlette>=2.1.0",
  "uvicorn[standard]>=0.30.0",
]
# `jsonschema` is for SARIF-output schema validation in tests/integration/
# (per RFC-0003). Lighter alternative to `sarif-tools` which pulled matplotlib
# + 17 other packages; we only need shape validation, not chart rendering.
# `pytest-cov` measures line coverage (issue #66); dev-only, so the core stays
# dependency-free (Hard Rule #2). Coverage config lives in [tool.coverage.*] below.
dev = ["ruff>=0.6.0", "pytest>=8.0.0", "jsonschema>=4.0.0", "pytest-cov>=5.0.0"]
# Optional Ed25519 signing backend (RFC-0002 / #31). cryptography is the standard
# Python crypto library and pulls only one transitive (`cffi`). Loaded lazily — a
# base install without this extra still `import tripwire` cleanly.
signing = ["cryptography>=42.0.0"]

[project.scripts]
tripwire = "tripwire.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tripwire"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# Includes flake8-bandit (S) — security linting per the course's Day-4 guidance.
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"examples/**" = ["S"]  # the demo intentionally models insecure behaviour (canary only)

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "-q"                                     # coverage is NOT in addopts — kept off make check's fast path; opt in via `make coverage` / CI.
pythonpath = ["src", "."]  # `.` so `from app.fast_api_app import app` works without PYTHONPATH override (Codex round 2 caveat).

# Coverage config (issue #66). `make coverage` and the CI `test-extras` leg pass
# `--cov` explicitly; this centralises source + exclusions so both agree.
# Advisory baseline: ~87% on the full extras suite. No `fail_under` gate yet —
# add one once the coverage-improving issues (#61/#62) land, to avoid blocking
# routine work on a floor set above real gaps (proxy.py error paths, app/ deploy).
[tool.coverage.run]
source = ["src/tripwire", "app"]
branch = false

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
